[package]
name = "cargo-list"
version = "0.38.2"
edition = "2024"
description = "List and update installed crates"
repository = "https://github.com/qtfkwk/cargo-list"
license = "MIT"
readme = "README.md"
keywords = ["cargo", "install", "list", "update", "crates"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
clap-cargo = "0"
dirs = "7"
env_logger = "0.11.11"
indexmap = { version = "2", features = ["rayon"] }
rayon = "1"
regex = "1"
reqwest = { version = "0", features = ["blocking", "json", "socks"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spinners = "4"
sprint = "0"
thiserror = "2.0.21"
toml = "1"
veg = { version = "0", features = ["colored"] }

[target.'cfg(unix)'.dependencies]
pager2 = "0"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unused_must_use = "deny"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
doc_markdown = "allow"
wildcard_imports = "allow"
missing_errors_doc = "allow"

