[package]
name = "cargo-list"
version = "0.38.7"
edition = "2024"
description = "List and update installed crates"
repository = "https://github.com/qtfkwk/cargo-list"
license = "MIT"
readme = "README.md"
keywords = ["cargo", "install", "list", "update", "crates"]
categories = ["development-tools::cargo-plugins", "command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
clap-cargo = "0.19.1"
dirs = "7.0.0"
env_logger = "0.11.11"
indexmap = { version = "2.14.2", features = ["rayon"] }
rayon = "1.12.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "json", "socks"] }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
spinners = "4.2.0"
sprint = "0.12.5"
thiserror = "2.0.21"
toml = "1.2.1"
veg = { version = "0.6.5", features = ["colored"] }

[target.'cfg(unix)'.dependencies]
pager2 = "0"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unused_must_use = "deny"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
doc_markdown = "allow"
wildcard_imports = "allow"
missing_errors_doc = "allow"

